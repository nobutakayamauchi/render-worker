name: Render HyperFrames Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install HyperFrames
        run: npm install -g hyperframes@0.8.19

      - name: Verify environment
        run: |
          node --version
          ffmpeg -version | head -n 1
          hyperframes --version

      - name: Render BridgePatch
        run: |
          mkdir -p renders
          hyperframes render \
            --output renders/bridgepatch.mp4 \
            --fps 30 \
            --quality standard \
            --workers 2

      - name: Inspect output
        run: |
          ls -lh renders/bridgepatch.mp4
          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=width,height \
            -of default=noprint_wrappers=1 \
            renders/bridgepatch.mp4

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: bridgepatch-render
          path: renders/bridgepatch.mp4
          if-no-files-found: error
          retention-days: 7
