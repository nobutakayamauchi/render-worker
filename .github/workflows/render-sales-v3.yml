name: Render AI CM Render Layered Motion v3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sales_ad_v3.html','assets/**','scripts/generate_sales_audio.sh','.github/workflows/render-sales-v3.yml']
jobs:
  render-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npm install -g hyperframes@0.8.19
      - name: Validate sources
        run: |
          test -f sales_ad_v3.html && test -f sales_ad_v2.html && test -f sales_ad.html && test -f index.html
          grep -q 'ai-cm-render-layered-v3' sales_ad_v3.html
          grep -q 'この広告、静止画5枚から作りました。' sales_ad_v3.html
          grep -q '19,800円' sales_ad_v3.html
      - name: Prepare isolated v3
        run: |
          cp index.html /tmp/bridgepatch-index.html
          cp sales_ad.html /tmp/sales-v1.html
          cp sales_ad_v2.html /tmp/sales-v2.html
          cp sales_ad_v3.html index.html
          mv sales_ad_v3.html /tmp/sales-v3.html
      - name: Render
        run: |
          mkdir -p renders dist
          hyperframes render --output renders/ai-cm-render-layered-v3-video.mp4 --fps 30 --quality standard --workers 2
      - name: Audio
        run: bash scripts/generate_sales_audio.sh dist
      - name: Mux
        run: ffmpeg -hide_banner -loglevel error -y -i renders/ai-cm-render-layered-v3-video.mp4 -i dist/ai_cm_render_sales_audio.wav -t 15 -map 0:v:0 -map 1:a:0 -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -movflags +faststart dist/ai_cm_render_layered_v3.mp4
      - name: Verify
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json dist/ai_cm_render_layered_v3.mp4 | tee dist/v3-probe.json
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 dist/ai_cm_render_layered_v3.mp4)" = h264
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 dist/ai_cm_render_layered_v3.mp4)" = aac
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 dist/ai_cm_render_layered_v3.mp4)" = 1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 dist/ai_cm_render_layered_v3.mp4)" = 1920
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 dist/ai_cm_render_layered_v3.mp4); awk -v d="$d" 'BEGIN{exit !(d>=14.9 && d<=15.1)}'
      - name: Preserve baselines
        run: |
          grep -q BridgePatch /tmp/bridgepatch-index.html
          grep -q ai-cm-render-sales-v1 /tmp/sales-v1.html
          grep -q ai-cm-render-sales-v2 /tmp/sales-v2.html
      - name: Restore source
        run: cp /tmp/sales-v3.html sales_ad_v3.html
      - uses: actions/upload-artifact@v4
        with:
          name: ai-cm-render-layered-v3
          path: |
            dist/ai_cm_render_layered_v3.mp4
            dist/v3-probe.json
            sales_ad_v3.html
          retention-days: 30
