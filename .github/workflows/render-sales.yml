name: Render AI CM Render Sales Ad v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sales_ad.html'
      - 'assets/**'
      - 'scripts/generate_sales_audio.sh'
      - '.github/workflows/render-sales.yml'

jobs:
  render-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npm install -g hyperframes@0.8.19

      - name: Validate sales composition inputs
        run: |
          test -f sales_ad.html
          test -f scripts/generate_sales_audio.sh
          for f in assets/01_email_reaction.png assets/02_workflow_diverge.png assets/03_lunch_contrast.png assets/04_afternoon_contrast.png assets/05_final_payoff.png assets/gsap.min.js; do test -f "$f"; done
          grep -q 'data-composition-id="ai-cm-render-sales-v1"' sales_ad.html
          grep -q 'data-duration="15"' sales_ad.html
          grep -q '19,800円' sales_ad.html

      - name: Prepare isolated sales composition
        run: |
          cp index.html index.bridgepatch.backup.html
          cp sales_ad.html index.html

      - name: Render sales composition with HyperFrames
        run: |
          mkdir -p renders dist
          hyperframes render --output renders/ai-cm-render-sales-video.mp4 --fps 30 --quality standard --workers 2

      - name: Generate sales BGM and transition cues
        run: bash scripts/generate_sales_audio.sh dist

      - name: Mux H.264 and AAC sales master
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i renders/ai-cm-render-sales-video.mp4 \
            -i dist/ai_cm_render_sales_audio.wav \
            -t 15 \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 48000 \
            -movflags +faststart dist/ai_cm_render_sales_v1.mp4

      - name: Verify final media
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json dist/ai_cm_render_sales_v1.mp4 | tee dist/sales-video-probe.json
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,codec_type,sample_rate,channels -of json dist/ai_cm_render_sales_v1.mp4 | tee dist/sales-audio-probe.json
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 dist/ai_cm_render_sales_v1.mp4)" = "audio"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 dist/ai_cm_render_sales_v1.mp4)" = "aac"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 dist/ai_cm_render_sales_v1.mp4)" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 dist/ai_cm_render_sales_v1.mp4)" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 dist/ai_cm_render_sales_v1.mp4)" = "1920"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 dist/ai_cm_render_sales_v1.mp4)"
          awk -v d="$duration" 'BEGIN { exit !(d >= 14.9 && d <= 15.1) }'

      - name: Confirm BridgePatch source was not changed by render preparation
        run: cmp -s index.html sales_ad.html && test -f index.bridgepatch.backup.html

      - name: Upload sales MP4 and probes
        uses: actions/upload-artifact@v4
        with:
          name: ai-cm-render-sales-v1
          path: |
            dist/ai_cm_render_sales_v1.mp4
            dist/sales-video-probe.json
            dist/sales-audio-probe.json
            sales_ad.html
          if-no-files-found: error
          retention-days: 30
